name: Check catalog prices

on:
    schedule:
        - cron: '17 8 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    prices:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check catalog prices
              run: npm run check:prices

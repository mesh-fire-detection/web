name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Blog posts live in their own repository; BLOG_DIR points the
            # build at this checkout. See config/build/vite.config.ts.
            - name: Checkout posts
              uses: actions/checkout@v7
              with:
                  repository: mesh-fire-detection/blog
                  path: blog

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check
              env:
                  BLOG_DIR: blog

    build:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Checkout posts
              uses: actions/checkout@v7
              with:
                  repository: mesh-fire-detection/blog
                  path: blog

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Check and build
              run: npm run check
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
                  BLOG_DIR: blog

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

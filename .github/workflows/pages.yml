name: Deploy to GitHub Pages

# Pull requests are checked. The site deploys only when a GitHub Release is
# published (web#21): merges collect on main until someone decides to ship.
# Running this by hand with an earlier tag deploys that release again, which
# is how to roll back; see docs/RELEASING.md.
on:
    pull_request:
        branches: [main]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: The release tag to deploy, such as v0.2.0
                required: true

permissions:
    contents: read

concurrency:
    group: pages-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Blog posts live in their own repository; BLOG_DIR points the
            # build at this checkout. See config/build/vite.config.ts.
            - name: Checkout posts
              uses: actions/checkout@v7
              with:
                  repository: mesh-fire-detection/blog
                  path: blog

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check
              env:
                  BLOG_DIR: blog

    build:
        # A prerelease is for looking at, not for the live site.
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: refs/tags/${{ env.TAG }}
                  # The whole history, to check the tag is on main.
                  fetch-depth: 0

            - name: Checkout posts
              uses: actions/checkout@v7
              with:
                  repository: mesh-fire-detection/blog
                  path: blog

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Check the tag
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::$TAG is not a release tag like v1.2.3"
                      exit 1
                  fi
                  # The footer shows package.json's version, so the two must agree.
                  version="v$(node -p "require('./package.json').version")"
                  if [[ "$version" != "$TAG" ]]; then
                      echo "::error::package.json says $version but the tag is $TAG"
                      exit 1
                  fi
                  # Only reviewed code ships: the tag must be on main.
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                      echo "::error::$TAG is not on main"
                      exit 1
                  fi

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Check and build
              run: npm run check
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
                  BLOG_DIR: blog

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
